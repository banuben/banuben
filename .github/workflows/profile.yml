name: Generate Dynamic Profile

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate GitHub Stats
        run: npx tsx scripts/generate-stats.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: banuben

      - name: Generate SVG Assets
        run: npx tsx scripts/generate-profile.ts

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): update dynamic assets"
