name: Refresh Profile Assets

# Fetches YOUR real GitHub stats via the GitHub GraphQL API and bakes them into
# assets/github-dashboard.svg, then commits it back. Runs on GitHub's own
# runners — nothing to deploy, no server, no third-party widgets.

on:
  schedule:
    - cron: "30 5 * * *"     # daily
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    branches: [ main ]        # also refresh on every push to main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Fetch stats (GitHub GraphQL)
        run: npx tsx scripts/generate-stats.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Render dashboard SVG
        run: npx tsx scripts/generate-profile.ts

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ data/
          git diff --staged --quiet || git commit -m "chore: refresh profile stats"
          git push
