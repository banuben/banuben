  <text x="640" y="104" text-anchor="middle" font-family="&#39;Inter&#39;,&#39;Segoe UI&#39;,system-ui,sans-serif" font-size="15" fill="#BCA98C">
    Thanks for stopping by — <tspan fill="#F2B25C" font-weight="600">open to collaboration</tspan> on AI &amp; data-intensive systems.
  </text>

  
  <g class="rk" transform="translate(1120,88)" filter="url(#fg)">
