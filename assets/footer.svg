      <stop offset="0" stop-color="#1B120A"></stop><stop offset="1" stop-color="#150F0A"></stop>
    </linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#F2B25C" stop-opacity="0.14"></stop><stop offset="1" stop-color="#F2B25C" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="fg" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.5"></feGaussianBlur></filter>
    
  </defs>
  <rect x="0" y="0" width="1280" height="150" rx="22" fill="url(#fbg)" stroke="#4A3722"></rect>
  <rect x="0" y="0" width="1280" height="150" rx="22" fill="url(#fglow)"></rect>

  
  <g fill="#F2B25C"><circle class="fp" cx="180" cy="40" r="1.6"></circle><circle class="fp" cx="1080" cy="110" r="1.6" style="animation-delay:1.5s"></circle><circle class="fp" cx="1180" cy="46" r="1.4" fill="#6DAFA8" style="animation-delay:2.4s"></circle><circle class="fp" cx="120" cy="112" r="1.4" fill="#D98C7A" style="animation-delay:.8s"></circle></g>

  
  <g transform="translate(400,52)" font-family="&#39;JetBrains Mono&#39;,ui-monospace,monospace" font-size="16">
